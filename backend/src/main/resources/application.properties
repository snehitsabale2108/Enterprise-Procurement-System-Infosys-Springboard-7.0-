spring.application.name=procurement

# Datasource
spring.datasource.url=jdbc:mysql://localhost:3306/procurement_db
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:ZmFrZS1zZWNyZXQta2V5LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLXBsZWFzZS0xMjM0NQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=8080
server.servlet.context-path=/

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.backend.procurement=INFO
